<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1007" height="1007" viewBox="0 0 1007 1007" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Blue-haired chibi maid — geometric vector reconstruction</title>
  <desc id="description">Hand-designed cubic Bezier shapes and ellipses, layered to match the supplied square reference. Fully vector, without embedded images, tracing, scripts, fonts or external dependencies.</desc>
  <defs>
